name: streakup
description: "Habit and Attendance Tracker App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  fl_chart: ^1.1.1
  provider: ^6.1.5+1
  intl: ^0.20.2

  # ✅ Notifications (stable combo)
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/applogo/applogo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
